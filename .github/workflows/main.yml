name: Update Latest NSE Holidays and Macro Events
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 15 * * *'  # Daily at 20:30 IST (15:00 UTC)
  workflow_dispatch:  # This allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CI_COMMIT_MESSAGE: Update latest NSE holidays and macro events
      CI_COMMIT_AUTHOR: shikharvaish28
    steps:
      - uses: actions/checkout@v3
      # Build steps
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10.x'
      - run: python --version
      - run: pip install -r requirements.txt
      - run: python holidays.py
      - run: python events.py

      # Commit and push all changed files if changes exist
      - name: GIT Commit Build Artifacts
        run: |
          git config --global user.name "${{ env.CI_COMMIT_AUTHOR }}"
          git config --global user.email "shikharvaish28@users.noreply.github.com"
          git add --all
          git diff --staged --quiet || (git commit -m "${{ env.CI_COMMIT_MESSAGE }}" && git push)
